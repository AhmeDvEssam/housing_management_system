{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لوحة المتابعة - منظومة إدارة المصايف</title>
    <style>
      :root {
        --bg: #f6f1ea;
        --bg-accent: #f1e6d7;
        --ink: #2a241f;
        --muted: #6a5f56;
        --brand: #0f4c5c;
        --brand-soft: #dfeef0;
        --border: #e3d7cb;
        --chip-text: #1e1a17;
        --chip-available: #e7f6ef;
        --chip-occupied: #fbe4e6;
        --chip-reserved: #fff3cf;
        --chip-lottery: #e5ecff;
        --chip-maintenance: #f4e8ff;
        --chip-notbookable: #ececec;
      }

      body {
        margin: 0;
        font-family: "Cairo", "Tajawal", "Noto Naskh Arabic", "Amiri", serif;
        color: var(--ink);
        background: radial-gradient(
            circle at 10% 20%,
            rgba(255, 255, 255, 0.75),
            rgba(246, 241, 234, 0.3)
          ),
          linear-gradient(180deg, #fffaf4, var(--bg));
      }

      .page {
        padding: 24px 20px 48px;
        max-width: 1300px;
        margin: 0 auto;
      }

      header {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.2px;
        color: var(--brand);
      }

      .subtitle {
        color: var(--muted);
        font-size: 15px;
      }

      .filters {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 12px 30px rgba(32, 24, 17, 0.08);
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        font-size: 13px;
        color: var(--muted);
      }

      select,
      input {
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-family: inherit;
        font-size: 14px;
        background: #fff;
      }

      .actions {
        display: flex;
        gap: 10px;
        align-items: end;
      }

      .btn {
        padding: 10px 16px;
        border: none;
        border-radius: 12px;
        background: var(--brand);
        color: #fff;
        font-family: inherit;
        cursor: pointer;
        font-size: 14px;
      }

      .btn.secondary {
        background: #cfe5ea;
        color: var(--brand);
      }

      .summary {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .summary-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 16px;
        min-width: 140px;
        box-shadow: 0 10px 24px rgba(32, 24, 17, 0.06);
      }

      .summary-card span {
        color: var(--muted);
        font-size: 12px;
      }

      .summary-card strong {
        display: block;
        font-size: 18px;
        margin-top: 4px;
        color: var(--ink);
      }

      .table-wrap {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 12px;
        overflow-x: auto;
        box-shadow: 0 14px 32px rgba(32, 24, 17, 0.08);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
      }

      th,
      td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
        text-align: center;
        font-size: 13px;
      }

      th {
        background: var(--bg-accent);
        color: var(--muted);
        font-weight: 600;
      }

      td:first-child,
      th:first-child {
        text-align: right;
        position: sticky;
        right: 0;
        background: #fff;
        z-index: 1;
      }

      .unit-meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
      }

      .unit-title {
        font-weight: 600;
        color: var(--ink);
        font-size: 14px;
      }

      .unit-sub {
        font-size: 12px;
        color: var(--muted);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 8px;
        border-radius: 999px;
        font-size: 11px;
        color: var(--chip-text);
        border: 1px solid transparent;
        white-space: nowrap;
      }

      .chip.AVAILABLE {
        background: var(--chip-available);
        border-color: #bfe5d1;
      }

      .chip.OCCUPIED {
        background: var(--chip-occupied);
        border-color: #f0b7bd;
      }

      .chip.RESERVED {
        background: var(--chip-reserved);
        border-color: #f4d37b;
      }

      .chip.LOTTERY_PENDING {
        background: var(--chip-lottery);
        border-color: #aab9ff;
      }

      .chip.MAINTENANCE {
        background: var(--chip-maintenance);
        border-color: #d0b4ff;
      }

      .chip.NOT_BOOKABLE {
        background: var(--chip-notbookable);
        border-color: #c9c9c9;
      }

      .error {
        background: #fff2f2;
        color: #a11a1a;
        border: 1px solid #f3b1b1;
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 16px;
      }

      .empty-state {
        background: #fff;
        border: 1px dashed var(--border);
        border-radius: 14px;
        padding: 18px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 720px) {
        .page {
          padding: 16px 12px 32px;
        }

        h1 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>لوحة المتابعة اليومية</h1>
        <div class="subtitle">
          تحديث تلقائي كل 10 ثوانٍ مع عرض حالة الوحدات حسب الأيام المختارة.
        </div>
      </header>

      <div class="filters">
        <div class="field">
          <label for="filter-date">التاريخ (DD-MM-YYYY)</label>
          <input id="filter-date" type="text" placeholder="01-06-2026" />
        </div>
        <div class="field">
          <label for="filter-days">عدد الأيام</label>
          <select id="filter-days">
            <option value="1">يوم واحد</option>
            <option value="7" selected>أسبوع</option>
            <option value="14">أسبوعين</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-club">النادي</label>
          <select id="filter-club">
            <option value="">الكل</option>
            {% for club in clubs %}
            <option value="{{ club.id }}">{{ club.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="filter-building">المبنى</label>
          <select id="filter-building">
            <option value="">الكل</option>
            {% for building in buildings %}
            <option value="{{ building.id }}">
              {{ building.name }} - {{ building.club.name }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="filter-floor">الدور</label>
          <select id="filter-floor">
            <option value="">الكل</option>
            {% for floor in floors %}
            <option value="{{ floor.id }}">
              {{ floor.label|default:"دور" }} {{ floor.level_number }} -
              {{ floor.building.name }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="filter-status">الحالة</label>
          <select id="filter-status">
            <option value="">الكل</option>
            <option value="AVAILABLE">متاح</option>
            <option value="OCCUPIED">مشغول</option>
            <option value="RESERVED">محجوز</option>
            <option value="LOTTERY_PENDING">قرعة – منتظر السداد</option>
            <option value="MAINTENANCE">تحت الصيانة</option>
            <option value="NOT_BOOKABLE">غير قابل للحجز</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-booking-type">نوع الحجز</label>
          <select id="filter-booking-type">
            <option value="">الكل</option>
            <option value="STANDARD">حجز عادي</option>
            <option value="LOTTERY">قرعة</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-capacity">السعة (حد أدنى)</label>
          <input id="filter-capacity" type="number" min="1" />
        </div>
        <div class="field">
          <label for="filter-orientation">الاتجاه</label>
          <select id="filter-orientation">
            <option value="">الكل</option>
            <option value="BAHARI">بحري</option>
            <option value="QIBLI">قبلي</option>
            <option value="SEA_VIEW">إطلالة بحر</option>
            <option value="BACK_VIEW">إطلالة خلفية</option>
          </select>
        </div>
        <div class="actions">
          <button id="apply-btn" class="btn" type="button">تطبيق</button>
          <button id="reset-btn" class="btn secondary" type="button">
            إعادة ضبط
          </button>
        </div>
      </div>

      <div id="error" class="error" hidden></div>

      <div id="summary" class="summary" hidden></div>

      <div id="table-wrap" class="table-wrap" hidden>
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <div id="empty-state" class="empty-state" hidden>
        لا توجد بيانات مطابقة للفلاتر الحالية.
      </div>
    </div>

    <script src="{% static 'dashboard/wallboard.js' %}" defer></script>
  </body>
</html>
